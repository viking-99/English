<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>โหมดเข้าใจ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
background:#0f1115;color:#e8eaed;padding:14px;max-width:560px;margin:0 auto;padding-bottom:118px;
user-select:none;-webkit-user-select:none}
h1{font-size:16px;margin-bottom:3px;font-weight:700}
.sub{font-size:12px;color:#6b7684;margin-bottom:12px}
.box{background:#181b22;border:1px solid #262b36;border-radius:14px;padding:14px;margin-bottom:12px}
.warn{background:#3a1f1f;border-color:#6b2b2b;color:#ffb4b4;font-size:13px}
.ok{background:#16301f;border-color:#2c5c3d;color:#a8e6bd;font-size:13px}
summary{cursor:pointer;font-size:14px;font-weight:600;color:#7cc4ff;padding:4px 0}
.grp{margin-top:14px;font-size:12px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:9px 0}
.row label{font-size:12px;color:#9aa5b1;min-width:78px}
select,input[type=range]{flex:1;background:#0f1115;color:#e8eaed;border:1px solid #313846;
border-radius:8px;padding:7px;font-size:12px}
button{background:#2a3140;color:#e8eaed;border:1px solid #3a4354;border-radius:9px;
padding:9px 12px;font-size:13px;cursor:pointer;font-family:inherit}
button:active{background:#3a4354}
.test{padding:7px 11px;font-size:12px;flex:0 0 auto}
.val{font-size:11px;color:#7cc4ff;min-width:36px;text-align:right}
/* progress */
#track{height:4px;background:#262b36;border-radius:3px;overflow:hidden;margin-bottom:7px}
#fill{height:100%;width:0;background:#4a9eff;transition:width .3s}
#meta{display:flex;justify-content:space-between;font-size:11px;color:#6b7684;margin-bottom:10px}
/* card */
#card{min-height:252px}
.side{padding:10px;border-radius:10px;margin-bottom:10px;transition:opacity .2s}
.q{background:#1b2430;border-left:3px solid #4a9eff}
.a{background:#251f30;border-left:3px solid #c084fc}
.dim{opacity:.35}
.tag{font-size:10px;letter-spacing:1px;color:#6b7684;margin-bottom:5px;display:flex;justify-content:space-between}
.th{font-size:15px;margin-bottom:6px;color:#cbd3dd}
.en{font-size:19px;font-weight:600;line-height:1.35}
.ph{font-size:13px;color:#8b95a3;margin-top:4px}
.line{padding:3px 0;cursor:pointer;border-radius:6px}
.hl{background:#4a9eff30;box-shadow:inset 0 0 0 1px #4a9eff66}
.hide{filter:blur(6px);opacity:.55}
#silence{display:none;text-align:center;padding:14px 0}
#ring{font-size:40px;font-weight:700;color:#4ade80}
#silence p{font-size:13px;color:#9aa5b1;margin-top:4px}
#pauseTag{display:none;text-align:center;font-size:12px;color:#facc15;margin-top:6px}
#bar{position:fixed;bottom:0;left:0;right:0;background:#151820;border-top:1px solid #262b36;
padding:10px;display:flex;gap:7px;justify-content:center;max-width:560px;margin:0 auto}
#bar button{flex:1;min-width:56px}
.big{background:#1e5eb8!important;border-color:#2a72d8!important;font-weight:600}
</style>
</head>
<body>

<h1 id="lessonTitle">01 · โหมดเข้าใจ</h1>
<div class="sub">ฟัง → พูดตาม · เลื่อนอัตโนมัติ ไม่ต้องกด</div>

<!-- ส่วนเลือกบทเรียน -->
<div class="row" style="margin-bottom: 12px;">
  <label style="color:#7cc4ff; font-weight:bold;">บทเรียน:</label>
  <select id="lessonSelect"></select>
</div>

<div id="voiceStatus" class="box warn">กำลังโหลดเสียง...</div>

<details class="box">
  <summary>⚙️ ตั้งค่า</summary>

  <div class="grp" style="color:#4a9eff">🔵 เสียง Q (คู่สนทนา)</div>
  <div class="row"><label>เสียง</label><select id="vQ"></select><button class="test" data-t="q">▶</button></div>
  <div class="row"><label>Pitch</label><input type="range" id="pQ" min="0.6" max="1.6" step="0.05" value="1.15"><span class="val" id="pQv"></span></div>

  <div class="grp" style="color:#c084fc">🟣 เสียง A (ตัวเรา)</div>
  <div class="row"><label>เสียง</label><select id="vA"></select><button class="test" data-t="a">▶</button></div>
  <div class="row"><label>Pitch</label><input type="range" id="pA" min="0.6" max="1.6" step="0.05" value="0.85"><span class="val" id="pAv"></span></div>

  <div class="grp" style="color:#facc15">🇹🇭 เสียงไทย</div>
  <div class="row"><label>เสียง</label><select id="vT"></select><button class="test" data-t="t">▶</button></div>
  <div class="row"><label>เปิดเสียงไทย</label><input type="checkbox" id="thOn" checked style="flex:0"></div>

  <div class="grp" style="color:#9aa5b1">⏱ จังหวะ</div>
  <div class="row"><label>เร็วปกติ</label><input type="range" id="r1" min="0.6" max="1.2" step="0.05" value="0.95"><span class="val" id="r1v"></span></div>
  <div class="row"><label>เร็วช้า</label><input type="range" id="r2" min="0.3" max="0.9" step="0.05" value="0.55"><span class="val" id="r2v"></span></div>
  <div class="row"><label>เล่นซ้ำ EN</label><input type="range" id="rep" min="1" max="3" step="1" value="3"><span class="val" id="repv"></span></div>
  <div class="row"><label>ช่วงเงียบ</label><input type="range" id="sil" min="2" max="10" step="1" value="4"><span class="val" id="silv"></span></div>
  <div class="row"><label>หน่วงเลื่อน</label><input type="range" id="dly" min="0" max="3" step="0.5" value="1"><span class="val" id="dlyv"></span></div>
  <div class="row"><label>เลื่อนอัตโนมัติ</label><input type="checkbox" id="auto" checked style="flex:0"></div>
  <div class="row"><button id="btnReset" style="flex:1">↺ คืนค่าเริ่มต้น</button></div>
</details>

<div id="track"><div id="fill"></div></div>
<div id="meta"><span id="pos"></span><span id="eta"></span></div>

<div class="box" id="card">
  <div class="side q" id="sideQ">
    <div class="tag"><span>QUESTION</span><span id="repQ"></span></div>
    <div class="line th" id="qTh"></div>
    <div class="line en" id="qEn"></div>
    <div class="line ph" id="qPh"></div>
  </div>
  <div class="side a" id="sideA">
    <div class="tag"><span>ANSWER</span><span id="repA"></span></div>
    <div class="line th" id="aTh"></div>
    <div class="line en" id="aEn"></div>
    <div class="line ph" id="aPh"></div>
  </div>
  <div id="silence"><div id="ring">4</div><p>🗣 พูดตามตอนนี้</p></div>
  <div id="pauseTag">⏸ หยุดชั่วคราว — แตะค้างอีกครั้งเพื่อเล่นต่อ</div>
</div>

<div id="bar">
  <button id="btnPrev">←</button>
  <button id="btnPlay" class="big">▶ เล่น</button>
  <button id="btnPause">⏸</button>
  <button id="btnStop">■</button>
  <button id="btnHide">👀</button>
  <button id="btnNext">→</button>
</div>

<!-- โหลด app.js ในรูปแบบ module -->
<script type="module" src="js/app.js"></script>
</body>
</html>
